# Used with docker-compose.prometheus.yaml / run-prometheus-server. This
# backend's application metrics all arrive by being pushed to it via the
# remote-write and OTLP receivers enabled on the command line, so the
# scrape_configs below are just for host-level metrics (see the root
# Makefile's init-node-exporter/run-node-exporter): one node_exporter per
# instance in the project, scraped over its internal IP.
global:
  scrape_interval: 15s

otlp:
  promote_all_resource_attributes: false

scrape_configs:
  - job_name: node
    static_configs:
      - targets: [10.140.15.202:9100]
        labels:
          host_name: loadgen
      - targets: [10.140.15.200:9100]
        labels:
          host_name: opentelemetry-collector-agent
      - targets: [10.140.15.196:9100]
        labels:
          host_name: otel-app-1
      - targets: [10.140.15.197:9100]
        labels:
          host_name: otel-app-2
      - targets: [10.140.15.199:9100]
        labels:
          host_name: prometheus-agent
      - targets: [10.140.15.194:9100]
        labels:
          host_name: prometheus-app-1
      - targets: [10.140.15.195:9100]
        labels:
          host_name: prometheus-app-2
      - targets: [10.140.15.201:9100]
        labels:
          host_name: prometheus-backend
      - targets: [10.140.15.203:9100]
        labels:
          host_name: uninstrumented-app-1
  - job_name: component-self-metrics
    static_configs:
      - targets: [10.140.15.202:9200]
        labels:
          host_name: loadgen
      - targets: [ 10.140.15.201:8000 ]
        labels:
          host_name: noop-receiver
      - targets: [ 10.140.15.200:8888 ]
        labels:
          host_name: opentelemetry-collector-agent
