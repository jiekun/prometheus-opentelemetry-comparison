# Runs the OpenTelemetry Collector configured to receive OTLP metrics
# pushed by cmd/otel-app instances running directly on a host (see
# deployment/Makefile's run-otel-app target). Publishing 4317/4318 to the
# host is what makes that work: otel-app's default
# OTEL_EXPORTER_OTLP_ENDPOINT (http://localhost:4317) resolves to this
# container from the host's perspective.
#
# Usage: docker compose -f docker-compose.otel-collector.yaml up
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./opentelemetry-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
