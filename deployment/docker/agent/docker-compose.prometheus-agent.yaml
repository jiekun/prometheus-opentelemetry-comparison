# Runs Prometheus in agent mode (--enable-feature=agent: scrape and
# forward only, no query API or long-term local storage), scraping
# cmd/prometheus-app instances running on remote hosts. See
# prometheus-agent.yaml for the scrape targets - edit the hostnames there
# to point at your real hosts, then restart this container.
#
# Usage: docker compose -f docker-compose.prometheus-agent.yaml up
services:
  prometheus-agent:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --enable-feature=agent
      - --storage.agent.path=/prometheus-agent
    volumes:
      - ./prometheus-agent.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-agent-data:/prometheus-agent
    ports:
      - "9090:9090" # Prometheus's own status/health endpoints
    restart: unless-stopped

volumes:
  prometheus-agent-data:
