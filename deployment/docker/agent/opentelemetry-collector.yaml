receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp_http/prometheus:
    metrics_endpoint: "http://10.140.15.201:9090/api/v1/otlp/v1/metrics"
    compression: gzip
    timeout: 10s
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp_http/prometheus ]

