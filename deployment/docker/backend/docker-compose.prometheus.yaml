# Runs Prometheus as a full backend (local TSDB + query API, not agent
# mode) with no scrape targets - metrics only arrive by being pushed to it:
#   - Prometheus remote-write (v1 and v2, auto-negotiated via the request's
#     Content-Type): POST to http://localhost:9090/api/v1/write
#   - Native OTLP metrics: POST to
#     http://localhost:9090/api/v1/otlp/v1/metrics
#
# --web.enable-otlp-receiver requires Prometheus >= v3.2.1; the "latest"
# tag here is well past that.
#
# Usage: docker compose -f docker-compose.prometheus.yaml up
services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  prometheus-data:
