# Prometheus running with --enable-feature=agent (see
# docker-compose.prometheus-agent.yaml): no local query API or long-term
# storage, just scrape and forward. Scrapes cmd/prometheus-app instances
# running on remote hosts (see deployment/Makefile's run-prometheus-app
# target, ports 8001-8100 per host).
#
# Configurable by hand: this ships with 3 placeholder hosts
# (target-host-1/2/3) x 100 ports each. Replace the placeholder hostnames
# below with your real hosts/IPs, add or remove target blocks to match
# how many hosts you actually have, then restart the container - no
# rebuild needed since this file is bind-mounted.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

