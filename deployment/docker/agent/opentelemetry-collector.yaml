# Variant used for the prometheus-app-only scrape comparison: instead of
# receiving OTLP pushed from otel-app (see opentelemetry-collector.yaml.bak
# for that version), this collector scrapes cmd/prometheus-app instances
# directly via the prometheusreceiver - the same way prometheus-agent.yaml
# and vmagent.yaml do - so otelcol's own scrape+forward overhead can be
# compared against theirs on identical targets.
#
# Configurable by hand: this ships with 2 placeholder hosts x 100 ports
# each, kept identical (by hand) to prometheus-agent.yaml/vmagent.yaml's
# scrape_configs. Replace the placeholder hostnames below with your real
# hosts/IPs, add or remove target blocks to match how many hosts you
# actually have, then restart the container - no rebuild needed since this
# file is bind-mounted. If you edit this, mirror the change into
# prometheus-agent.yaml and vmagent.yaml too.
